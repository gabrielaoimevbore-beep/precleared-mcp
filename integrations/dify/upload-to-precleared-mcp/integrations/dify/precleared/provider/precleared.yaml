identity:
  author: precleared
  name: precleared
  label:
    en_US: Precleared
  description:
    en_US: Check whether a cold or marketing email to one recipient is allowed before your agent sends it, with the rule quoted, the footer requirements and a signed receipt.
  icon: icon.svg
  tags:
    - business
    - productivity
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: Precleared API key
    placeholder:
      en_US: pc_live_...
    help:
      en_US: Your Precleared API key, which starts with pc_live_. Get a free key at precleared.dev/get-key. Dify sends requests from shared servers, so a key of your own is needed.
    url: https://precleared.dev/get-key
tools:
  - tools/check_cold_email.yaml
  - tools/get_receipt.yaml
extra:
  python:
    source: provider/precleared.py
